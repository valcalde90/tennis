<style>
:root{--bg:#46543C;--panel:#FBFAF4;--line:rgba(35,42,30,.09);--line2:rgba(35,42,30,.14);--tx:#232A1E;--tx2:#3A4433;--mut:#7A8471;--mut2:#6B7562;--dim:#98A08D;--teal:#4F7A3F;--red:#B96246;--amber:#C08A2E;--purp:#5F7BB0;--purp2:#54719F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#C9CDB9;border-radius:4px}
header{padding:26px 20px 12px;background:transparent;border-bottom:none;margin-top:0}
.hrow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#CBE54E,#B7D63C);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
h1{font-size:18px;font-family:'Fraunces',Georgia,serif;font-weight:700;letter-spacing:-.02em;line-height:1}
.sub{font-size:10px;color:var(--mut);font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.hbtns{margin-left:auto;display:flex;gap:6px}
.hbtn{padding:6px 10px;font-size:10px;background:rgba(35,42,30,.04);border:1px solid rgba(35,42,30,.08);border-radius:8px;color:var(--mut);cursor:pointer;font-family:inherit;font-weight:500}
nav{display:flex;gap:4px;flex-wrap:wrap}
.navbtn{padding:7px 13px;font-size:11px;font-weight:400;background:transparent;color:var(--mut);border:none;border-radius:6px;cursor:pointer;font-family:inherit;letter-spacing:.02em}
.navbtn.on{background:rgba(35,42,30,.08);color:#fff;font-weight:600}
.navbtn.add{background:rgba(79,122,63,.08);color:var(--teal);border:1px solid rgba(79,122,63,.2)}
.navbtn.add.on{background:rgba(35,42,30,.08);color:#fff;border:none}
main{padding:26px 20px 46px;max-width:800px;margin:14px auto 0;background:var(--panel);border-radius:26px 26px 0 0;box-shadow:0 -10px 30px rgba(20,26,15,.20);animation:fu .4s ease both;min-height:72vh}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.lbl{font-size:11px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.sc{padding:14px 16px;background:rgba(35,42,30,.02);border:1px solid var(--line);border-radius:10px}
.sc.sm{padding:10px 12px}
.sc .l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:500;margin-bottom:4px}
.sc .v{font-size:20px;font-weight:700}
.sc.sm .v{font-size:16px}
.sc .s{font-size:10px;color:var(--mut);margin-top:2px}
.mr{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(35,42,30,.04);cursor:pointer;transition:background .2s}
.mr:active{background:rgba(35,42,30,.04)}
.wl{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-right:12px;flex-shrink:0}
.wl.w{background:rgba(79,122,63,.12);color:var(--teal)}.wl.l{background:rgba(185,98,70,.12);color:var(--red)}.wl.f{background:rgba(95,123,176,.12);color:var(--purp)}
.mtop{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.msub{font-size:11px;color:var(--mut)}
.badge{font-size:9px;padding:1px 6px;border-radius:3px;background:rgba(95,123,176,.15);color:var(--purp);font-weight:600;text-transform:uppercase}
.score{font-size:13px;font-weight:600;font-family:ui-monospace,monospace;letter-spacing:.02em;flex-shrink:0;margin-left:8px}
.trow{display:flex;align-items:center;width:100%;padding:14px 16px;background:rgba(35,42,30,.02);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;text-align:left;color:inherit;font-family:inherit}
.trow.fri{background:rgba(95,123,176,.04);border-color:rgba(95,123,176,.12)}
.tcat{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-right:14px;flex-shrink:0}
.bar{height:6px;background:rgba(35,42,30,.06);border-radius:3px;overflow:hidden}
.barfill{height:100%;border-radius:3px;transition:width .6s ease}
.inp{width:100%;padding:11px 14px;background:rgba(35,42,30,.04);border:1px solid var(--line2);border-radius:8px;color:var(--tx);font-size:14px;font-family:inherit}

select.inp{appearance:none;cursor:pointer;background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%237A8471' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center}
select.inp option{background:#FBFAF4}
.fld{margin-bottom:14px}
.flbl{font-size:11px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:block}
.btn{width:100%;padding:14px;font-size:15px;font-weight:600;border:none;border-radius:10px;cursor:pointer;font-family:inherit;transition:opacity .2s}
.btn:disabled{background:rgba(35,42,30,.04)!important;color:var(--dim)!important;cursor:not-allowed}
.btn.teal{background:linear-gradient(135deg,#CBE54E,#B7D63C);color:#1E2A16}
.btn.amber{background:linear-gradient(135deg,#3E4F33,#2E3A28);color:#F5F3E8}
.seg{padding:5px 10px;font-size:10px;font-weight:400;background:transparent;border:1px solid rgba(35,42,30,.08);border-radius:6px;color:var(--mut);cursor:pointer;font-family:inherit}
.seg.on{background:rgba(79,122,63,.12);border-color:rgba(79,122,63,.3);color:var(--teal);font-weight:600}
.tgl{flex:1;padding:11px;font-size:13px;font-weight:600;background:rgba(35,42,30,.03);border:1px solid rgba(35,42,30,.08);border-radius:8px;color:var(--mut);cursor:pointer;font-family:inherit}
.tgl.won{background:rgba(79,122,63,.15);border:2px solid var(--teal);color:var(--teal)}
.tgl.lost{background:rgba(185,98,70,.15);border:2px solid var(--red);color:var(--red)}
.skbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:rgba(35,42,30,.04);color:var(--tx);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0}
.skbtn:disabled{opacity:.3;cursor:default}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border-radius:14px 14px 0 0;width:100%;max-width:500px;max-height:88vh;overflow:auto;border:1px solid var(--line2);border-bottom:none;padding:20px}
.handle{width:36px;height:4px;background:rgba(35,42,30,.15);border-radius:2px;margin:0 auto 16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2E3A28;border:1px solid rgba(203,229,78,.45);color:#CBE54E;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:300;box-shadow:0 8px 30px rgba(0,0,0,.35);animation:fu .3s ease}
.back{font-size:12px;color:var(--mut);background:none;border:none;cursor:pointer;margin-bottom:16px;font-family:inherit;display:flex;align-items:center;gap:4px}
.pill{font-size:10px;padding:2px 8px;border-radius:4px;border:none}
h2.tname{font-size:20px;font-family:'Fraunces',Georgia,serif;font-weight:600;margin-bottom:4px}
.arc{padding:16px 20px;border-radius:12px;margin-bottom:12px}
textarea.inp{min-height:140px;font-size:11px;font-family:ui-monospace,monospace;resize:vertical}
.step{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.stepn{width:22px;height:22px;border-radius:50%;background:rgba(79,122,63,.1);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}

header h1{color:#F5F3E8}
.sub{color:#CBD5BC}
.hbtn{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);color:#E9EDDD}
.navbtn{color:#D8DECB}
.navbtn.on{background:#F5F3E8;color:#232A1E;font-weight:700}
.navbtn.add{background:#CBE54E;color:#1E2A16;border:none;font-weight:700}
.navbtn.add.on{background:#F5F3E8;color:#232A1E}
.logo{box-shadow:0 2px 8px rgba(0,0,0,.25)}
.sc{box-shadow:0 1px 2px rgba(30,36,24,.05);border-radius:16px}
.trow{box-shadow:0 1px 2px rgba(30,36,24,.05);border-radius:16px}
.btn{border-radius:14px}
.mr:active{background:rgba(35,42,30,.05)!important}
h2.tname{letter-spacing:-.01em}
</style>

<header>
  <div class="hrow">
    <div class="logo">🎾</div>
    <div>
      <h1>Tennis Tracker</h1>
      <div class="sub">by valcalde90</div>
    </div>
    <div class="hbtns">
      <button class="hbtn" onclick="openExport()">📤 CSV</button>
      <button class="hbtn" onclick="openImport()">📥 Importar</button>
    </div>

<script>
"use strict";
/* ============ SEED DATA (v10 — 26 partidos) ============ */
const SEED = [
  { id:"f1", name:"Partidos Amistosos", category:"AMI", venue:"", format:"Singles amistosos", status:"En curso", friendly:true, matches:[] },
];
const DEFAULT_SKILLS = { sacPlano:5, sacSlice:5, sacKick:5, dhTopspin:5, dhPlano:5, revSlice:5, revTopspin:5, volea:5, globo:5, dropshot:5, approach:5, footwork:5, mentalidad:5 };
const LS_PLAYER = "tt-player-v1";
const DEFAULT_PLAYER = { name:"Jugador", age:"", hand:"Diestro", clubs:[] };
const LEGACY_VENUE = "Club Berimbau"; // sede asignada a respaldos CSV antiguos (sin columna Sede)
const CC = { C:"#4F7A3F", B:"#C08A2E", AMI:"#5F7BB0", A:"#C46A9A" };
const LS_DATA = "tt-data-v1", LS_SKILLS = "tt-skills-v1";

/* ============ PURE HELPERS ============ */
function parseScore(score){
  const sets = score.split(",").map(s=>s.trim());
  let gw=0,gl=0,sw=0,sl=0;
  sets.forEach(set=>{
    const p=set.split("-").map(Number);
    if(!isNaN(p[0])&&!isNaN(p[1])){ gw+=p[0]; gl+=p[1]; if(p[0]>p[1])sw++; else sl++; }
  });
  return {gamesWon:gw,gamesLost:gl,setsWon:sw,setsLost:sl};
}
function parseSets(score){
  return score.split(",").map(s=>s.trim()).map(set=>{
    const p=set.split("-").map(Number); return {my:p[0],op:p[1]};
  }).filter(s=>!isNaN(s.my)&&!isNaN(s.op));
}
function fmtDate(d){
  const mo=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const dt=new Date(d+"T12:00:00");
  return dt.getDate()+" "+mo[dt.getMonth()]+" "+dt.getFullYear();
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function initials(n){ const w=String(n||"").trim().split(/\s+/).filter(Boolean); if(!w.length)return "🎾"; return (w[0][0]+(w[1]?w[1][0]:"")).toUpperCase(); }
function csvEsc(v){ const s=String(v==null?"":v); return (s.includes("|")||s.includes('"')||s.includes("\n")) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function csvUnesc(v){ let s=String(v==null?"":v).trim(); if(s.startsWith('"')&&s.endsWith('"')){ s=s.slice(1,-1).replace(/""/g,'"'); } return s; }
function generateCSV(tournaments){
  const headers=["Fecha","Torneo","Sede","Categoría","Tipo","Ronda","Rival","Marcador","Resultado","Sets W","Sets L","Games W","Games L"];
  const rows=[];
  tournaments.forEach(t=>{ t.matches.forEach(m=>{
    const s=parseScore(m.score);
    rows.push([m.date, t.name, (m.venue!==undefined?m.venue:(t.venue||"")), t.friendly?"Amistoso":("Clase "+t.category), t.friendly?"Amistoso":"Competitivo", m.round||"—", m.opponent, m.score, m.won?"Victoria":"Derrota", s.setsWon, s.setsLost, s.gamesWon, s.gamesLost]);
  });});
  rows.sort((a,b)=>String(a[0]).localeCompare(String(b[0])));
  return [headers.map(csvEsc).join("|")].concat(rows.map(r=>r.map(csvEsc).join("|"))).join("\n");
}
function fixMojibake(s){
  if(!/[\u00C2\u00C3\u00E2\u0080-\u009F]/.test(s)) return s;
  try{
    var cp={"\u20AC":0x80,"\u201A":0x82,"\u0192":0x83,"\u201E":0x84,"\u2026":0x85,"\u2020":0x86,"\u2021":0x87,"\u02C6":0x88,"\u2030":0x89,"\u0160":0x8A,"\u2039":0x8B,"\u0152":0x8C,"\u017D":0x8E,"\u2018":0x91,"\u2019":0x92,"\u201C":0x93,"\u201D":0x94,"\u2022":0x95,"\u2013":0x96,"\u2014":0x97,"\u02DC":0x98,"\u2122":0x99,"\u0161":0x9A,"\u203A":0x9B,"\u0153":0x9C,"\u017E":0x9E,"\u0178":0x9F};
    var bytes=new Uint8Array(s.length);
    for(var bi=0;bi<s.length;bi++){
      var code=s.charCodeAt(bi);
      if(code<=0xFF) bytes[bi]=code;
      else if(cp[s[bi]]!==undefined) bytes[bi]=cp[s[bi]];
      else return s;
    }
    var dec=new TextDecoder("utf-8",{fatal:true}).decode(bytes);
    return /[\u00C3\u00E2\u0080-\u009F]/.test(dec) ? s : dec;
  }catch(e){ return s; }
}
function parseCSVImport(text, existingTournaments){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rawLines=text.split(/\r?\n/);
  const lines=[];
  rawLines.forEach(function(l){
    var t=l.trim();
    if(!t) return;
    if(/^\d{4}-\d{2}-\d{2}\|/.test(t) || t.toLowerCase().startsWith("fecha|") || !lines.length){ lines.push(l); }
    else { lines[lines.length-1]+=l; }
  });
  for(var _li=0; _li<lines.length; _li++) lines[_li]=fixMojibake(lines[_li].trim());
  const headerLine=lines.find(l=>l.toLowerCase().startsWith("fecha|"))||"";
  const headerNew=/\|sede\|/i.test(headerLine);
  const dataLines=lines.filter(l=>!l.toLowerCase().startsWith("fecha|"));
  const errors=[];
  const rows=[];
  dataLines.forEach((l,i)=>{
    const cols=l.split("|").map(csvUnesc);
    const nf=headerNew || cols.length>=13;
    if(cols.length<(nf?9:8)){ errors.push("Línea "+(i+1)+": columnas insuficientes"); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(cols[0]) || +cols[0].slice(5,7)<1 || +cols[0].slice(5,7)>12 || +cols[0].slice(8,10)<1 || +cols[0].slice(8,10)>31){ errors.push("Línea "+(i+1)+": fecha inválida '"+cols[0]+"'"); return; }
    if(nf){
      rows.push({ date:cols[0], tName:cols[1], venue:(cols[2]||"").trim(), cat:cols[3], tipo:cols[4], round:cols[5]||"—", opponent:cols[6], score:cols[7], won:cols[8].trim()==="Victoria" });
    } else {
      rows.push({ date:cols[0], tName:cols[1], venue:LEGACY_VENUE, cat:cols[2], tipo:cols[3], round:cols[4]||"—", opponent:cols[5], score:cols[6], won:cols[7].trim()==="Victoria" });
    }
  });
  if(!rows.length){ return {ok:false, errors: errors.length?errors:["No se encontraron filas válidas"]}; }
  if(errors.length){ return {ok:false, errors: errors}; }
  const byName={}; const order=[];
  rows.forEach(r=>{ if(!byName[r.tName]){ byName[r.tName]=[]; order.push(r.tName); } byName[r.tName].push(r); });
  let mc=0;
  const tournaments=order.map((name,ti)=>{
    const rws=byName[name];
    const friendly = rws[0].tipo.trim()==="Amistoso" || rws[0].cat.trim()==="Amistoso";
    const cat = friendly ? "AMI" : (rws[0].cat.includes("B") ? "B" : (rws[0].cat.includes("A") && !rws[0].cat.includes("C") && rws[0].cat.trim()!=="Amistoso" ? (rws[0].cat.includes("Clase A")?"A":"C") : "C"));
    const prev = (existingTournaments||[]).find(t=>t.name===name);
    return {
      id: prev ? prev.id : ("imp_t"+(ti+1)),
      name: name,
      category: prev ? prev.category : cat,
      venue: prev ? (prev.venue||rws[0].venue||"") : (rws[0].venue||""),
      format: prev ? prev.format : (friendly ? "Singles amistosos" : "—"),
      status: prev ? prev.status : (friendly ? "En curso" : (function(){
        var last=rws.reduce(function(a,r){return r.date>a?r.date:a;}, rws[0].date);
        var days=(Date.now()-new Date(last+"T12:00:00").getTime())/86400000;
        return days>21 ? "Finalizado" : "En curso";
      })()),
      friendly: friendly,
      matches: rws.map(r=>{ mc++; return { id:"imp_m"+mc, date:r.date, opponent:r.opponent, score:r.score, won:r.won, round:r.round, venue:r.venue }; })
    };
  });
  return {ok:true, tournaments:tournaments, count:rows.length, errors:errors};
}
function calcProfileData(s){
  const sv=Object.values(s);
  const sacAvg=(s.sacPlano+s.sacSlice+s.sacKick)/3;
  const ghAvg=(s.dhTopspin+s.dhPlano+s.revSlice+s.revTopspin)/4;
  const netAvg=(s.volea+s.dropshot+s.approach)/3;
  const netFull=(s.volea+s.globo+s.dropshot+s.approach)/4;
  const aggression=(s.dhTopspin+s.dhPlano+s.approach)/3;
  const defense=(s.revSlice+s.footwork+s.mentalidad+s.globo)/4;
  const netDom=netAvg-Math.max(ghAvg,sacAvg);
  const sacDom=sacAvg-Math.max(ghAvg,netFull);
  const ghDom=ghAvg-Math.max(netFull,sacAvg);
  let a,d,c,i;
  if(netAvg>=7&&netDom>=2){a="Serve & Volleyer";c="#5F7BB0";i="🔥";d="Tu juego de red es tu arma principal. Buscas subir a la red en cada oportunidad — con approach, tras el saque, o con chip & charge. Voleas, drop shots y remates son tus herramientas para cerrar puntos rápido y quitarle tiempo al rival.";}
  else if(netAvg>=8&&sacAvg>=6){a="Serve & Volleyer";c="#5F7BB0";i="🔥";d="Estilo ofensivo de transición: sirves y subes a la red. Tu combinación de saque sólido y juego de red te permite presionar al rival quitándole tiempo.";}
  else if(sacAvg>=8&&sacDom>=1.5){a="Big Server";c="#C46A9A";i="💣";d="Tu saque es tu arma más letal. Buscas dominar con aces, saques sin respuesta y puntos de saque +1. Los rallies largos no son tu zona de confort.";}
  else if(sacAvg>=7&&sacAvg>ghAvg&&sacAvg>netFull&&sacDom>=1){a="Big Server";c="#C46A9A";i="💣";d="Tu saque es tu mejor herramienta. Abres el punto con ventaja y buscas resolverlo en los primeros golpes.";}
  else if(ghAvg>=6&&netFull>=6&&sacAvg>=5&&Math.min.apply(null,sv)>=5&&(Math.max.apply(null,sv)-Math.min.apply(null,sv))<=4&&aggression<7){a="All-Court Player";c="#4F7A3F";i="🌐";d="Jugador versátil, cómodo en todas las zonas de la cancha. Combinas fondo con red y adaptas tu juego según el rival.";}
  else if(ghAvg>=5&&netFull>=5&&sacAvg>=5&&defense>=5&&Math.min.apply(null,sv)>=4&&(Math.max.apply(null,sv)-Math.min.apply(null,sv))<=4&&Math.max(netDom,sacDom,ghDom)<2&&aggression<7){a="All-Court Player";c="#4F7A3F";i="🌐";d="Jugador equilibrado con recursos en todas las áreas. Tu versatilidad te permite adaptarte a distintos estilos de rival.";}
  else if(s.dhTopspin>=7&&aggression>=7){a="Attacking Baseliner";c="#C08A2E";i="⚡";d="Dominas desde el fondo con golpes agresivos y pesados. Tu derecha topspin y planos buscan dictar el punto, mover al rival y forzar errores. Toleras poco la defensa — prefieres tomar la iniciativa.";}
  else if((s.dhTopspin>=7||s.dhPlano>=7)&&ghAvg>netFull){a="Attacking Baseliner";c="#C08A2E";i="⚡";d="Dominas desde el fondo con golpes agresivos. Tu derecha es tu arma principal para dictar el ritmo del punto.";}
  else if(s.footwork>=7&&s.mentalidad>=7&&defense>aggression){a="Counter Puncher";c="#5B87A8";i="🛡️";d="Tu juego se basa en defensa sólida, cobertura de cancha y paciencia. Dejas que el rival cometa errores y aprovechas el momento para contraatacar.";}
  else if(defense>=6&&aggression<5.5&&s.footwork>=6){a="Counter Puncher";c="#5B87A8";i="🛡️";d="Eres un jugador defensivo que desgasta al rival con consistencia. Tu paciencia y cobertura de cancha hacen que el oponente tenga que arriesgar.";}
  else if(ghAvg>=5&&aggression<7){a="Solid Baseliner";c="#5E9A62";i="🎯";d="Equilibras ataque y defensa desde el fondo. Construyes puntos con consistencia y esperas el momento correcto para acelerar.";}
  else{
    const best=Math.max(sacAvg,ghAvg,netAvg,defense);
    if(best===netAvg){a="Serve & Volleyer";c="#5F7BB0";i="🔥";d="Tu instinto es subir a la red.";}
    else if(best===sacAvg){a="Big Server";c="#C46A9A";i="💣";d="Tu saque es lo que más destaca en tu juego.";}
    else if(best===defense){a="Counter Puncher";c="#5B87A8";i="🛡️";d="Tu fortaleza está en la defensa.";}
    else{a="Solid Baseliner";c="#5E9A62";i="🎯";d="Juegas un tenis equilibrado desde el fondo.";}
  }
  const parts=[];
  const sacBest=Math.max(s.sacPlano,s.sacSlice,s.sacKick); const sacN=[];
  if(s.sacPlano>=sacBest-1&&s.sacPlano>=6)sacN.push("plano");
  if(s.sacSlice>=sacBest-1&&s.sacSlice>=6)sacN.push("slice");
  if(s.sacKick>=sacBest-1&&s.sacKick>=6)sacN.push("kick");
  if(sacBest>=8)parts.push("Saque potente"+(sacN.length?" con variantes "+sacN.join(" y "):"")+".");
  else if(sacBest>=6)parts.push("Saque funcional"+(sacN.length?" ("+sacN.join(", ")+")":"")+", en desarrollo.");
  else parts.push("Saque en construcción — área de oportunidad clara.");
  if(s.dhTopspin>=8&&s.dhPlano>=7)parts.push("Derecha como arma principal — topspin pesado y planos agresivos que buscan dictar el punto.");
  else if(s.dhTopspin>=7)parts.push("Derecha topspin sólida que permite construir puntos con profundidad.");
  else if(s.dhPlano>=7)parts.push("Derecha plana agresiva, busca definir con golpes ganadores.");
  else if(s.dhTopspin>=5)parts.push("Derecha en nivel intermedio, con espacio para ganar consistencia.");
  else parts.push("Derecha en desarrollo — priorizar mecánica y confianza.");
  if(s.revTopspin>=7&&s.revSlice>=7)parts.push("Revés completo: topspin para atacar y slice para defender y variar ritmo.");
  else if(s.revSlice>=7&&s.revTopspin<6)parts.push("Revés preferentemente en slice — efectivo para defensa y approach, topspin en desarrollo.");
  else if(s.revTopspin>=7)parts.push("Revés topspin como herramienta de ataque, slice como complemento.");
  else if(s.revSlice>=5)parts.push("Revés funcional con slice, buscando incorporar más topspin.");
  else parts.push("Revés como área principal de mejora en ambas variantes.");
  const nS=[];
  if(s.volea>=7)nS.push("voleas"); if(s.globo>=7)nS.push("globos"); if(s.dropshot>=7)nS.push("drop shots");
  if(nS.length>=2)parts.push("Buen juego de red con "+nS.join(" y ")+" como recurso táctico.");
  else if(s.volea>=6)parts.push("Juego de red aceptable, con potencial para explotar más la subida.");
  else parts.push("Juego de red por desarrollar — puede ser un diferenciador si se trabaja.");
  if(s.mentalidad>=8&&s.footwork>=7)parts.push("Mentalmente sólido con buen movimiento de pies.");
  else if(s.mentalidad>=7)parts.push("Buena fortaleza mental en puntos importantes.");
  else if(s.footwork>=7)parts.push("Buen movimiento de pies y cobertura de cancha.");
  return {archetype:a, arcDesc:d, arcColor:c, arcIcon:i, bio:parts.join(" ")};
}

/* ============ STATE & PERSISTENCE ============ */
let state = { tournaments: SEED, skills: Object.assign({}, DEFAULT_SKILLS), player: Object.assign({}, DEFAULT_PLAYER), profile: null, view:"dashboard", selT:null, statsScope:"comp", formWon:null };
function saveData(){ try{ localStorage.setItem(LS_DATA, JSON.stringify(state.tournaments)); }catch(e){} }
function saveSkills(){ try{ localStorage.setItem(LS_SKILLS, JSON.stringify(state.skills)); }catch(e){} }
function savePlayer(){ try{ localStorage.setItem(LS_PLAYER, JSON.stringify(state.player)); }catch(e){} }
function loadAll(){
  try{ const d=localStorage.getItem(LS_DATA); if(d){ const p=JSON.parse(d); if(Array.isArray(p)&&p.length){ state.tournaments=p; } } else { saveData(); } }catch(e){}
  try{ const s=localStorage.getItem(LS_SKILLS); if(s){ state.skills=Object.assign({}, DEFAULT_SKILLS, JSON.parse(s)); } }catch(e){}
  try{ const p=localStorage.getItem(LS_PLAYER); if(p){ state.player=Object.assign({}, DEFAULT_PLAYER, JSON.parse(p)); } }catch(e){}
  // Migración: sedes por partido + clubs del jugador derivados de sus datos
  var _mig=false;
  state.tournaments.forEach(function(t){ t.matches.forEach(function(m){ if(m.venue===undefined){ m.venue=t.venue||""; _mig=true; } }); });
  if(_mig) saveData();
  if(!state.player.clubs || !Array.isArray(state.player.clubs)) state.player.clubs=[];
  if(!state.player.clubs.length){
    var _vs=[];
    state.tournaments.forEach(function(t){
      var v=(t.venue||"").trim(); if(v&&_vs.indexOf(v)<0)_vs.push(v);
      t.matches.forEach(function(m){ var mv=(m.venue||"").trim(); if(mv&&_vs.indexOf(mv)<0)_vs.push(mv); });
    });
    if(_vs.length){ state.player.clubs=_vs; savePlayer(); }
  }
  state.profile = calcProfileData(state.skills);
}

/* ============ DERIVED ============ */
function derive(){
  const all = state.tournaments.flatMap(t=>t.matches.map(m=>Object.assign({}, m, {tournamentId:t.id, category:t.category, tournamentName:t.name, friendly:t.friendly})));
  const comp = all.filter(m=>!m.friendly);
  const fri = all.filter(m=>m.friendly);
  const cW=comp.filter(m=>m.won).length, cL=comp.length-cW;
  const fW=fri.filter(m=>m.won).length, fL=fri.length-fW;
  let gw=0,gl=0,sw=0,sl=0;
  comp.forEach(m=>{const s=parseScore(m.score);gw+=s.gamesWon;gl+=s.gamesLost;sw+=s.setsWon;sl+=s.setsLost;});
  let cur=0,best=0,tp=null;
  comp.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(m=>{
    if(!cur){cur=1;tp=m.won?"W":"L";}
    else if((m.won&&tp==="W")||(!m.won&&tp==="L"))cur++;
    else{cur=1;tp=m.won?"W":"L";}
    if(tp==="W"&&cur>best)best=cur;
  });
  const opps={};
  all.forEach(m=>{
    if(!opps[m.opponent])opps[m.opponent]={cW:0,cL:0,fW:0,fL:0,matches:[]};
    if(m.friendly){m.won?opps[m.opponent].fW++:opps[m.opponent].fL++;}
    else{m.won?opps[m.opponent].cW++:opps[m.opponent].cL++;}
    opps[m.opponent].matches.push(m);
  });
  return {all,comp,fri,cW,cL,cPct:comp.length?Math.round(cW/comp.length*100):0,fW,fL,gw,gl,sw,sl,streak:tp==="W"?cur:0,streakL:tp==="L"?cur:0,bestStreak:best,opps};
}

function viewStats(d){
  const ms = state.statsScope==="comp" ? d.comp : d.all;
  const fsW={w:0,l:0}, fsL={w:0,l:0}, two={w:0,l:0}, three={w:0,l:0}, stb={w:0,l:0};
  let tbW=0,tbL=0,gW=0,gL=0;
  ms.forEach(m=>{
    const sets=parseSets(m.score);
    if(!sets.length)return;
    sets.forEach(s=>{gW+=s.my;gL+=s.op;if(s.my===7&&s.op===6)tbW++;if(s.my===6&&s.op===7)tbL++;});
    const f=sets[0];
    if(f.my>f.op){m.won?fsW.w++:fsW.l++;}else{m.won?fsL.w++:fsL.l++;}
    if(sets.length===2){m.won?two.w++:two.l++;}
    if(sets.length>=3){
      m.won?three.w++:three.l++;
      const t=sets[2];
      if(Math.max(t.my,t.op)>=8){m.won?stb.w++:stb.l++;}
    }
  });
  const pct=r=>{const t=r.w+r.l;return t?Math.round(r.w/t*100):0;};
  const monthly={};
  ms.forEach(m=>{const k=m.date.slice(0,7);if(!monthly[k])monthly[k]={w:0,l:0};m.won?monthly[k].w++:monthly[k].l++;});

  h+='<div class="lbl">Evolución mensual</div>';
  mKeys.forEach(k=>{
    const dd=monthly[k];

      +(dd.w>0?'<div style="width:'+(dd.w/mMax*100)+'%;background:rgba(79,122,63,.7)"></div>':'')

  }

  // ── Récords personales (insignias) ──
  (function(){

    var badges=[];
    if(bs>=2) badges.push(['Mejor racha', bs+' victorias', fmtDate(bsStart).slice(0,-5)+' – '+fmtDate(bsEnd).slice(0,-5)]);

function sedeSel(selId, otherId){
  var s=document.getElementById(selId), o=document.getElementById(otherId);

function readSede(selId, otherId){
  var s=document.getElementById(selId); if(!s) return "";

  if(v==="__otro__"){ var o=document.getElementById(otherId); v=o?(o.value||"").trim():""; }

function ensureClub(v){
  if(!v) return;
  state.player.clubs=state.player.clubs||[];
  if(state.player.clubs.indexOf(v)<0){ state.player.clubs.push(v); savePlayer(); }
}
function syncSede(){
  var tid=document.getElementById("f-tid").value;
  var t=state.tournaments.find(function(x){return x.id===tid;});
  if(!t) return;
  var v=(t.venue||"").trim();
  var s=document.getElementById("f-sede");
  if(!s||!v) return;
  for(var i=0;i<s.options.length;i++){ if(s.options[i].value===v){ s.value=v; sedeSel("f-sede","f-sede-otro"); return; } }
}
function toast(msg){
  const old=document.querySelector(".toast"); if(old)old.remove();
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2200);
}

  const tid=document.getElementById("f-tid").value;
  const opp=document.getElementById("f-opp").value.trim();
  const date=document.getElementById("f-date").value;
  const sets=[];
  for(let i=1;i<=3;i++){
    const my=document.getElementById("f-s"+i+"my").value.replace(/[^0-9]/g,"");
    const op=document.getElementById("f-s"+i+"op").value.replace(/[^0-9]/g,"");
    if(my&&op)sets.push(my+"-"+op);
  }
  const round=document.getElementById("f-round").value.trim();
  if(!tid){toast("Selecciona el torneo");return;}
  if(!opp){toast("Escribe el nombre del rival");return;}
  if(!date){toast("Selecciona la fecha");return;}
  if(sets.length<2){toast("Captura al menos 2 sets completos");return;}
  if(state.formWon===null){toast("Marca Victoria o Derrota");return;}
  const sede=readSede("f-sede","f-sede-otro");
  const match={ id:"u_"+Date.now(), date:date, opponent:opp, score:sets.join(", "), won:state.formWon, round:round||"—", venue:sede };
  ensureClub(sede);
  state.tournaments=state.tournaments.map(t=>t.id===tid?Object.assign({},t,{matches:t.matches.concat([match])}):t);
  saveData();
  state.formWon=null;
  toast("Partido registrado ✓");
  render();
}
function submitTournament(){
  const name=document.getElementById("t-name").value.trim();
  const cat=document.getElementById("t-cat").value;
  const fmt=document.getElementById("t-fmt").value.trim();
  if(!name){toast("Escribe el nombre del torneo");return;}
  const sede=readSede("t-sede","t-sede-otro");
  ensureClub(sede);
  state.tournaments=state.tournaments.concat([{ id:"u_t"+Date.now(), name:name, category:cat, venue:sede||"", format:fmt||"En curso", status:"En curso", friendly:false, matches:[] }]);
  saveData();
  toast("Torneo creado ✓");
  render();
}
function openEdit(tid, mid){
  const t=state.tournaments.find(x=>x.id===tid); if(!t)return;
  const m=t.matches.find(x=>x.id===mid); if(!m)return;
  const root=document.getElementById("modal-root");
  root.innerHTML='<div class="modal-back" onclick="closeModal(event)">'
    +'<div class="sheet" onclick="event.stopPropagation()">'
    +'<div class="handle"></div>'
    +'<div style="font-size:16px;font-weight:600;margin-bottom:16px">Editar partido</div>'
    +'<div class="fld"><label class="flbl">Rival</label><input class="inp" id="e-opp" type="text" value="'+esc(m.opponent)+'"></div>'
    +'<div class="fld"><label class="flbl">Fecha</label><input class="inp" id="e-date" type="date" value="'+m.date+'"></div>'
    +'<div class="fld"><label class="flbl">Marcador</label><input class="inp" id="e-score" type="text" value="'+esc(m.score)+'" placeholder="6-3, 6-2"></div>'
    +'<div class="fld"><label class="flbl">Ronda</label><input class="inp" id="e-round" type="text" value="'+esc(m.round||"")+'"></div>'
    +'<div class="fld"><label class="flbl">Sede / Club</label><input class="inp" id="e-sede" type="text" value="'+esc(m.venue||"")+'" placeholder="Club / sede"></div>'
    +'<div class="fld" style="margin-bottom:20px"><label class="flbl">Resultado</label><div style="display:flex;gap:8px">'
    +'<button class="tgl'+(m.won?' won':'')+'" id="e-btnW" onclick="ePickWon(true)">Victoria ✓</button>'
    +'<button class="tgl'+(!m.won?' lost':'')+'" id="e-btnL" onclick="ePickWon(false)">Derrota ✗</button></div></div>'
    +'<button class="btn teal" style="margin-bottom:12px" onclick="saveEdit(\''+tid+'\',\''+mid+'\')">Guardar cambios</button>'
    +'<button style="width:100%;padding:10px;font-size:12px;font-weight:500;background:none;border:1px solid rgba(185,98,70,.2);border-radius:8px;color:var(--red);cursor:pointer;font-family:inherit" onclick="deleteEdit(\''+tid+'\',\''+mid+'\')">Eliminar partido</button>'
    +'</div></div>';
  window._editWon = m.won;
}
function ePickWon(v){
  window._editWon=v;
  document.getElementById("e-btnW").className="tgl"+(v===true?" won":"");
  document.getElementById("e-btnL").className="tgl"+(v===false?" lost":"");
}
function saveEdit(tid, mid){
  const opp=document.getElementById("e-opp").value.trim();
  const date=document.getElementById("e-date").value;
  const score=document.getElementById("e-score").value.trim();
  const round=document.getElementById("e-round").value.trim();
  const sede=document.getElementById("e-sede").value.trim();
  if(!opp||!score||!date){toast("Completa rival, fecha y marcador");return;}
  ensureClub(sede);
  state.tournaments=state.tournaments.map(t=>t.id===tid?Object.assign({},t,{matches:t.matches.map(m=>m.id===mid?Object.assign({},m,{opponent:opp,date:date,score:score,round:round||"—",venue:sede,won:window._editWon}):m)}):t);
  saveData(); closeModal(); toast("Partido actualizado ✓"); render();
}
function deleteEdit(tid, mid){
  if(!confirm("¿Eliminar este partido? No se puede deshacer."))return;
  state.tournaments=state.tournaments.map(t=>t.id===tid?Object.assign({},t,{matches:t.matches.filter(m=>m.id!==mid)}):t);
  saveData(); closeModal(); toast("Partido eliminado"); render();
}
function closeModal(ev){
  if(ev&&ev.target&&!ev.target.classList.contains("modal-back"))return;
  document.getElementById("modal-root").innerHTML="";
}
function openTEdit(tid){
  var t=state.tournaments.find(function(x){return x.id===tid;});
  if(!t||t.friendly) return;
  window._tEditId=tid;
  var root=document.getElementById("modal-root");
  root.innerHTML='<div class="modal-back" onclick="closeModal(event)">'
    +'<div class="sheet" onclick="event.stopPropagation()">'
    +'<div class="handle"></div>'
    +'<div style="font-size:16px;font-weight:600;margin-bottom:16px">Editar torneo</div>'
    +'<div class="fld"><label class="flbl">Nombre</label><input class="inp" id="te-name" type="text" value="'+esc(t.name)+'"></div>'
    +'<div class="fld"><label class="flbl">Categoría</label><select class="inp" id="te-cat">'
    +'<option value="C"'+(t.category==="C"?" selected":"")+'>Clase C</option>'
    +'<option value="B"'+(t.category==="B"?" selected":"")+'>Clase B</option>'
    +'<option value="A"'+(t.category==="A"?" selected":"")+'>Clase A</option></select></div>'
    +'<div class="fld"><label class="flbl">Sede / Club</label><input class="inp" id="te-sede" type="text" value="'+esc(t.venue||"")+'" placeholder="Club / sede"></div>'
    +'<div class="fld" style="margin-bottom:20px"><label class="flbl">Formato (opcional)</label><input class="inp" id="te-fmt" type="text" value="'+esc(t.format||"")+'"></div>'
    +'<button class="btn teal" style="margin-bottom:12px" onclick="saveTEdit()">Guardar</button>'
    +'<button style="width:100%;padding:12px;font-size:13px;background:rgba(35,42,30,.04);border:1px solid rgba(35,42,30,.08);border-radius:8px;color:var(--mut);cursor:pointer;font-family:inherit" onclick="closeModal()">Cancelar</button>'
    +'</div></div>';
}
function saveTEdit(){
  var tid=window._tEditId;
  var name=document.getElementById("te-name").value.trim();
  var cat=document.getElementById("te-cat").value;
  var sede=document.getElementById("te-sede").value.trim();
  var fmt=document.getElementById("te-fmt").value.trim();
  if(!name){toast("Escribe el nombre del torneo");return;}
  if(state.tournaments.some(function(x){return x.id!==tid && x.name===name;})){toast("Ya existe un torneo con ese nombre");return;}
  ensureClub(sede);
  state.tournaments=state.tournaments.map(function(x){
    if(x.id!==tid) return x;
    var oldV=x.venue||"";
    return Object.assign({},x,{name:name,category:cat,venue:sede,format:fmt||x.format,
      matches:x.matches.map(function(m){ return (m.venue||"")===oldV?Object.assign({},m,{venue:sede}):m; })});
  });
  saveData(); closeModal(); toast("Torneo actualizado ✓"); render();
}
function toggleTStatus(tid){
  state.tournaments=state.tournaments.map(t=>t.id===tid?Object.assign({},t,{status:t.status==="En curso"?"Finalizado":"En curso"}):t);
  saveData(); toast("Estado del torneo actualizado ✓"); render();
}
function normName(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/\s+/g," "); }
function openRivalEdit(oldName){
  var count=0;
  state.tournaments.forEach(function(t){ t.matches.forEach(function(m){ if(m.opponent===oldName) count++; }); });
  window._rivOld=oldName;
  var root=document.getElementById("modal-root");
  root.innerHTML='<div class="modal-back" onclick="closeModal(event)">'
    +'<div class="sheet" onclick="event.stopPropagation()">'
    +'<div class="handle"></div>'
    +'<div style="font-size:16px;font-weight:600;margin-bottom:6px">Renombrar rival</div>'
    +'<div style="font-size:12px;color:var(--mut);margin-bottom:16px">'+count+' partido'+(count===1?'':'s')+' se actualizar'+(count===1?'á':'án')+'. Si escribes el nombre de otro rival existente, se fusionarán en uno solo.</div>'
    +'<div class="fld" style="margin-bottom:20px"><label class="flbl">Nombre</label><input class="inp" id="rv-name" type="text" value="'+esc(oldName)+'"></div>'
    +'<button class="btn teal" style="margin-bottom:12px" onclick="saveRivalEdit()">Guardar</button>'
    +'<button style="width:100%;padding:12px;font-size:13px;background:rgba(35,42,30,.04);border:1px solid rgba(35,42,30,.08);border-radius:8px;color:var(--mut);cursor:pointer;font-family:inherit" onclick="closeModal()">Cancelar</button>'
    +'</div></div>';
}
function saveRivalEdit(){
  var oldName=window._rivOld;
  var newName=document.getElementById("rv-name").value.trim();
  if(!newName){toast("Escribe el nombre");return;}
  if(newName===oldName){closeModal();return;}
  var oldC=0, newC=0;
  state.tournaments.forEach(function(t){ t.matches.forEach(function(m){ if(m.opponent===oldName) oldC++; else if(m.opponent===newName) newC++; }); });
  if(newC>0 && !confirm('Ya existe "'+newName+'" con '+newC+' partido'+(newC===1?'':'s')+'. ¿Fusionar los '+oldC+' de "'+oldName+'" bajo "'+newName+'"?')) return;
  state.tournaments=state.tournaments.map(function(t){ return Object.assign({},t,{matches:t.matches.map(function(m){ return m.opponent===oldName?Object.assign({},m,{opponent:newName}):m; })}); });
  saveData(); closeModal();
  toast(oldC+' partido'+(oldC===1?'':'s')+' actualizado'+(oldC===1?'':'s')+' ✓');
  render();
}
function openPlayerEdit(keep){
  const p=state.player;
  if(!keep) window._pClubs=(p.clubs||[]).slice();
  const root=document.getElementById("modal-root");
  var prevN=keep?document.getElementById("p-name").value:esc(p.name);
  var prevA=keep?document.getElementById("p-age").value:esc(p.age);
  var prevH=keep?document.getElementById("p-hand").value:p.hand;
  var chips='';
  window._pClubs.forEach(function(c,i){
    chips+='<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(79,122,63,.12);border:1px solid rgba(79,122,63,.3);color:#33511F;border-radius:16px;padding:5px 10px;font-size:13px;font-weight:600;margin:0 6px 6px 0">'+esc(c)
      +'<span onclick="rmClub('+i+')" style="cursor:pointer;font-weight:800;color:#B96246">×</span></span>';
  });
  if(!chips) chips='<span style="font-size:12px;color:var(--mut)">Sin clubs aún — agrega el tuyo</span>';
  root.innerHTML='<div class="modal-back" onclick="closeModal(event)">'
    +'<div class="sheet" onclick="event.stopPropagation()">'
    +'<div class="handle"></div>'
    +'<div style="font-size:16px;font-weight:600;margin-bottom:16px">Mi perfil</div>'
    +'<div class="fld"><label class="flbl">Nombre</label><input class="inp" id="p-name" type="text" value="'+prevN+'" placeholder="Tu nombre"></div>'
    +'<div class="fld"><label class="flbl">Edad (opcional)</label><input class="inp" id="p-age" type="text" inputmode="numeric" maxlength="3" value="'+prevA+'" placeholder="—"></div>'
    +'<div class="fld"><label class="flbl">Mano</label><select class="inp" id="p-hand">'
    +'<option value="Diestro"'+(prevH==="Diestro"?" selected":"")+'>Diestro</option>'
    +'<option value="Zurdo"'+(prevH==="Zurdo"?" selected":"")+'>Zurdo</option></select></div>'
    +'<div class="fld" style="margin-bottom:20px"><label class="flbl">Mis clubs (el primero es tu club principal)</label>'
    +'<div style="margin-bottom:8px">'+chips+'</div>'
    +'<div style="display:flex;gap:8px"><input class="inp" id="p-club-new" type="text" placeholder="Nombre de tu club" style="flex:1">'
    +'<button class="seg on" style="flex-shrink:0" onclick="addClub()">+ Agregar</button></div></div>'
    +'<button class="btn teal" style="margin-bottom:12px" onclick="savePlayerEdit()">Guardar</button>'
    +'<button style="width:100%;padding:12px;font-size:13px;background:rgba(35,42,30,.04);border:1px solid rgba(35,42,30,.08);border-radius:8px;color:var(--mut);cursor:pointer;font-family:inherit" onclick="closeModal()">Cancelar</button>'
    +'</div></div>';
}
function addClub(){
  var v=(document.getElementById("p-club-new").value||"").trim();
  if(!v){toast("Escribe el nombre del club");return;}
  if(window._pClubs.indexOf(v)>=0){toast("Ese club ya está en tu lista");return;}
  window._pClubs.push(v);
  openPlayerEdit(true);
}
function rmClub(i){
  window._pClubs.splice(i,1);
  openPlayerEdit(true);
}
function savePlayerEdit(){
  const name=document.getElementById("p-name").value.trim();
  const age=document.getElementById("p-age").value.replace(/[^0-9]/g,"");
  const hand=document.getElementById("p-hand").value;
  if(!name){toast("Escribe tu nombre");return;}
  state.player={name:name,age:age,hand:hand,clubs:window._pClubs.slice()};
  savePlayer(); closeModal(); toast("Perfil guardado ✓"); render();
}
function openExport(){
  const csv=generateCSV(state.tournaments);
  const root=document.getElementById("modal-root");
  root.innerHTML='<div class="modal-back" onclick="closeModal(event)">'
    +'<div class="sheet" onclick="event.stopPropagation()">'
    +'<div class="handle"></div>'
    +'<div style="font-size:17px;font-weight:600;text-align:center;margin-bottom:4px">Backup de datos</div>'
    +'<div style="font-size:12px;color:var(--mut);text-align:center;margin-bottom:18px">'+state.tournaments.length+' torneos · '+state.tournaments.reduce((a,t)=>a+t.matches.length,0)+' partidos</div>'
    +'<button class="btn teal" style="margin-bottom:10px" onclick="copyCSV()">📋 Copiar CSV al portapapeles</button>'
    +'<button class="btn amber" style="margin-bottom:18px" onclick="downloadCSV()">📥 Descargar archivo .csv</button>'
    +'<div class="lbl">Después de copiar</div>'
    +'<div class="step"><span class="stepn">1</span><div><div style="font-size:13px;font-weight:500">Abrir Google Sheets</div><div style="font-size:11px;color:var(--mut)">sheets.new en Chrome</div></div></div>'
    +'<div class="step"><span class="stepn">2</span><div><div style="font-size:13px;font-weight:500">Tocar celda A1 → Pegar</div><div style="font-size:11px;color:var(--mut)">Datos → Dividir texto en columnas → separador: |</div></div></div>'
    +'<div class="step" style="margin-bottom:16px"><span class="stepn">3</span><div><div style="font-size:13px;font-weight:500">Renombrar archivo</div><div style="font-size:11px;color:var(--mut)">Tennis_Berimbau_'+new Date().toISOString().slice(0,10)+'</div></div></div>'
    +'<button style="width:100%;padding:12px;font-size:13px;background:rgba(35,42,30,.04);border:1px solid rgba(35,42,30,.08);border-radius:8px;color:var(--mut);cursor:pointer;font-family:inherit" onclick="closeModal()">Cerrar</button>'
    +'</div></div>';
  window._csv=csv;
}
function copyCSV(){
  try{
    const ta=document.createElement("textarea");
    ta.value=window._csv;
    ta.style.cssText="position:fixed;opacity:0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    toast("✓ CSV copiado al portapapeles");
  }catch(e){
    if(navigator.clipboard)navigator.clipboard.writeText(window._csv).then(()=>toast("✓ CSV copiado")).catch(()=>toast("Error al copiar"));
  }
}
function downloadCSV(){
  try{
    const blob=new Blob(["\uFEFF"+window._csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="Tennis_Berimbau_"+new Date().toISOString().slice(0,10)+".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast("Descarga iniciada ✓");
  }catch(e){ toast("Usa Copiar CSV"); }
}
function openImport(){
  const root=document.getElementById("modal-root");
  root.innerHTML='<div class="modal-back" onclick="closeModal(event)">'
    +'<div class="sheet" onclick="event.stopPropagation()">'
    +'<div class="handle"></div>'
    +'<div style="font-size:17px;font-weight:600;text-align:center;margin-bottom:4px">Importar CSV</div>'
    +'<div style="font-size:12px;color:var(--mut);text-align:center;margin-bottom:14px">Reemplaza todos los datos actuales. Si hay errores, no se importa nada.</div>'
    +'<input type="file" id="imp-file" accept=".csv,text/csv,text/plain" style="display:none" onchange="impFile(event)">'
    +'<button class="btn amber" style="margin-bottom:10px" onclick="document.getElementById(\'imp-file\').click()">📄 Elegir archivo CSV</button>'
    +'<div style="font-size:11px;color:var(--mut2);text-align:center;margin-bottom:8px">o pega el contenido aquí</div>'
    +'<textarea class="inp" id="imp-text" placeholder="Fecha|Torneo|Sede|Categoría|Tipo|Ronda|Rival|Marcador|..."></textarea>'
    +'<button class="btn teal" style="margin-top:14px;margin-bottom:10px" onclick="doImport()">Importar datos</button>'
    +'<button style="width:100%;padding:12px;font-size:13px;background:rgba(35,42,30,.04);border:1px solid rgba(35,42,30,.08);border-radius:8px;color:var(--mut);cursor:pointer;font-family:inherit" onclick="closeModal()">Cancelar</button>'
    +'</div></div>';
}
function impFile(ev){
  var f=ev.target.files&&ev.target.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){ document.getElementById("imp-text").value=r.result; toast("Archivo cargado ✓ — toca Importar datos"); };
  r.onerror=function(){ toast("No se pudo leer el archivo"); };
  r.readAsText(f);
}
function doImport(){
  const text=document.getElementById("imp-text").value;
  if(!text.trim()){toast("Elige el archivo o pega el CSV primero");return;}
  const result=parseCSVImport(text, state.tournaments.length?state.tournaments:SEED);
  if(!result.ok){ alert("No se importó NADA — tus datos actuales quedan intactos.\n\nErrores encontrados:\n"+result.errors.join("\n")); return; }
  if(!confirm("Se importarán "+result.count+" partidos en "+result.tournaments.length+" torneos, REEMPLAZANDO los datos actuales. ¿Continuar?"))return;
  state.tournaments=result.tournaments;
  saveData(); closeModal();
  toast("✓ "+result.count+" partidos importados");
  render();
}
function resetSeed(){
  if(!confirm("¿Restaurar los datos originales (26 partidos)? Se perderán los cambios."))return;
  state.tournaments=JSON.parse(JSON.stringify(SEED));
  saveData(); toast("Datos restaurados"); render();
}

/* ============ BOOT ============ */
function boot(){ loadAll(); render(); }
function showFatal(msg){
  try{
    var m=document.getElementById("main");
    if(m && !m.innerHTML) m.innerHTML='<div style="padding:24px;font-family:monospace;font-size:13px;color:#B96246"><b>Error al cargar la app</b><br><br>'+String(msg).replace(/</g,"&lt;")+'<br><br>Toma captura y repórtalo.</div>';
  }catch(e){}
}
if (typeof window !== "undefined") window.addEventListener("error", function(e){ showFatal(e.message||e.error); });
if (typeof document !== "undefined" && typeof localStorage !== "undefined") {
  try{ boot(); }catch(e){ showFatal(e && e.message ? e.message : e); }
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function(){}); }
  window.addEventListener("appinstalled", function(){ try{ if (typeof gtag === "function") gtag("event", "pwa_install"); }catch(e){} });
}
</script>
